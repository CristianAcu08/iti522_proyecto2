<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Tienda de Computo</title>
</head>
<body>
    <div class="container">
        <header style="background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%); padding: 2rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: center; box-shadow: 0 4px 20px rgba(14, 165, 233, 0.3);">
            <h1 style="margin: 0; color: white; font-size: 2.5rem; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">💻 Tienda de Computo</h1>
            <p style="margin: 0.5rem 0 0; color: rgba(255,255,255,0.9); font-size: 1.1rem;">Sistema de Gestión de Inventario - ITI-522</p>
        </header>
        <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
            <button id="addProductBtn" style="background: linear-gradient(135deg, #a855f7 0%, #8b5cf6 100%); color: white; padding: 0.8rem 2rem; font-size: 1rem; border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); cursor: pointer; font-weight: 600; transition: all 0.2s;">➕ Nuevo Producto</button>
        </div>
        <div id="productsList" class="products-list"></div>
        
        <div id="productModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="document.getElementById('productModal').classList.remove('show')">X</span>
                <h2 id="modalTitle">Producto</h2>
                <form id="productForm">
                    <input type="text" id="productName" placeholder="Nombre" required>
                    <textarea id="productDescription" placeholder="Descripción"></textarea>
                    <input type="number" id="productPrice" placeholder="Precio" required>
                    <input type="number" id="productStock" placeholder="Stock" required>
                    <button type="submit">Guardar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
